# CloverWeb Nginx 站点（HTTP 初始版；certbot 会自动改写为 443 + redirect）
# 部署位置：/etc/nginx/sites-available/cloverweb

server {
    listen 80;
    server_name communitygarden.org.cn www.communitygarden.org.cn;

    # certbot 续签验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---- 前端（Vue history 路由，try_files 回退 index.html）----
    root /opt/cloverweb/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态产物长缓存（vite hash 文件名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # UEditorPlus 静态资源（public 目录随 dist 部署）
    location /UEditorPlus/ {
        expires 7d;
    }

    # ---- 后端 API（gunicorn）----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # UEditor 视频上传 200MB
        client_max_body_size 220m;
        proxy_read_timeout 120s;
    }

    # Django admin
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/admin/ {
        alias /opt/cloverweb/backend/staticfiles/admin/;
        expires 1d;
    }

    # Django collectstatic（rest_framework 等）
    location /static/ {
        alias /opt/cloverweb/backend/staticfiles/;
        expires 7d;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}
