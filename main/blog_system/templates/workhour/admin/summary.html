<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>月度工时汇总 - 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-color: #2E7D32; --bg-color: #F5F5F5; }
        body { background-color: var(--bg-color); font-family: 'Noto Sans SC', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .card-header { background: linear-gradient(135deg, var(--primary-color), #4CAF50); color: white; border-radius: 12px 12px 0 0 !important; }
        .table th { background-color: #E8F5E9; font-weight: 600; border: none; }
        .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
        .btn-primary:hover { background-color: #4CAF50; border-color: #4CAF50; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1" style="color: var(--primary-color);">
                    <i class="bi bi-collection me-2"></i>月度工时汇总表
                </h2>
                <p class="text-muted mb-0">员工姓名 | 项目名称 | 工时分配</p>
            </div>
            <div class="d-flex gap-2 no-print">
                <a href="/workhour/admin/" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回
                </a>
                <a class="btn btn-primary" id="exportBtn">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i>导出CSV
                </a>
                <button class="btn btn-outline-secondary" onclick="window.print()">
                    <i class="bi bi-printer me-1"></i>打印
                </button>
            </div>
        </div>

        <div class="card mb-4 no-print">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="col-auto"><label class="form-label mb-0">选择月份</label></div>
                    <div class="col-auto">
                        <select class="form-select" id="selectYear">
                            {% for y in range(year-2, year+1) %}
                            <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}年</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-auto">
                        <select class="form-select" id="selectMonth">
                            {% for m in range(1, 13) %}
                            <option value="{{ m }}" {% if m == month %}selected{% endif %}>{{ m }}月</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary" onclick="loadSummary()">
                            <i class="bi bi-search me-1"></i>查询
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-table me-2"></i><span id="tableTitle">{{ year }}年{{ month }}月工时汇总</span></h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead>
                            <tr>
                                <th style="width: 20%;">员工姓名</th>
                                <th style="width: 55%;">项目名称</th>
                                <th style="width: 25%;">工时分配（天）</th>
                            </tr>
                        </thead>
                        <tbody id="summaryTableBody">
                            <tr><td colspan="3" class="text-center text-muted py-5"><i class="bi bi-hourglass-split fs-3"></i><p class="mt-2 mb-0">正在加载...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted text-center no-print">
                <small>数据来源：员工提交的月度工时统计</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentYear = {{ year }};
        let currentMonth = {{ month }};
        let summaryData = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadSummary();
            document.getElementById('selectYear').addEventListener('change', e => currentYear = parseInt(e.target.value));
            document.getElementById('selectMonth').addEventListener('change', e => currentMonth = parseInt(e.target.value));
            document.getElementById('exportBtn').addEventListener('click', () => { if(summaryData.length) window.location.href = `/workhour/admin/api/export/${currentYear}/${currentMonth}`; });
        });

        async function loadSummary() {
            try {
                const response = await fetch(`/workhour/admin/api/summary/${currentYear}/${currentMonth}`);
                const result = await response.json();
                if (result.code === 200) {
                    summaryData = result.data;
                    renderSummaryTable();
                    document.getElementById('tableTitle').textContent = `${currentYear}年${currentMonth}月工时汇总`;
                    document.getElementById('exportBtn').style.display = summaryData.length ? 'inline-block' : 'none';
                }
            } catch (error) {
                document.getElementById('summaryTableBody').innerHTML = '<tr><td colspan="3" class="text-center text-danger py-5"><i class="bi bi-exclamation-triangle fs-3"></i><p class="mt-2 mb-0">加载失败</p></td></tr>';
            }
        }

        function renderSummaryTable() {
            const tbody = document.getElementById('summaryTableBody');
            if (!summaryData.length) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-5"><i class="bi bi-inbox fs-3"></i><p class="mt-2 mb-0">暂无工时数据</p></td></tr>';
                return;
            }
            let html = '', currentEmployee = '';
            summaryData.forEach(item => {
                const isNew = item.employee_name !== currentEmployee;
                if (isNew) currentEmployee = item.employee_name;
                html += `<tr><td>${isNew ? item.employee_name : ''}</td><td>${item.project_name}</td><td><strong>${item.work_days.toFixed(1)}</strong> 天</td></tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
