<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工时统计 - 系统提示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #2E7D32; }
        body { 
            background: linear-gradient(135deg, #E8F5E9, #fff); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .card-header { background: var(--primary-color); border-radius: 16px 16px 0 0 !important; }
        .info-section { background: #f8f9fa; border-radius: 8px; padding: 16px; margin: 16px 0; }
        .info-item { display: flex; justify-content: space-between; margin: 8px 0; }
        .info-label { font-weight: 500; color: #666; }
        .info-value { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center py-4">
                        <h4 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>系统提示</h4>
                    </div>
                    <div class="card-body text-center py-5">
                        <i class="bi bi-person-x fs-1 text-muted mb-4"></i>
                        <h5 class="mb-3">未找到员工</h5>
                        
                        {% if request.args.get('name') or request.args.get('open_id') %}
                        <div class="info-section">
                            <h6 class="mb-3">飞书用户信息</h6>
                            <div class="info-item">
                                <span class="info-label">姓名：</span>
                                <span class="info-value">{{ request.args.get('name', '未知') }}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Open ID：</span>
                                <span class="info-value">{{ request.args.get('open_id', '未知') }}</span>
                            </div>
                        </div>
                        {% endif %}
                        
                        <p class="text-muted mb-4">
                            未找到员工，请联系管理员添加。
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
