{% extends "admin/base.html" %}

{% block title %}修改密码 - 管理后台{% endblock %}

{% block extra_css %}
<style>
    .password-form-container {
        max-width: 500px;
        margin: 0 auto;
    }
    
    .password-form .form-group {
        margin-bottom: 25px;
    }
    
    .password-form .form-input {
        width: 100%;
    }
    
    .password-form .btn {
        width: 100%;
        padding: 14px 24px;
        font-size: 16px;
    }
    
    .password-tips {
        background: var(--bg-cream);
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    
    .password-tips h4 {
        color: var(--primary-green);
        margin-bottom: 12px;
        font-size: 14px;
    }
    
    .password-tips ul {
        list-style: none;
        padding: 0;
    }
    
    .password-tips li {
        position: relative;
        padding-left: 20px;
        margin-bottom: 8px;
        color: var(--text-gray);
        font-size: 13px;
    }
    
    .password-tips li::before {
        content: "•";
        position: absolute;
        left: 5px;
        color: var(--primary-green);
    }
    
    .password-strength {
        margin-top: 10px;
        font-size: 12px;
    }
    
    .strength-bar {
        height: 4px;
        background: var(--bg-cream);
        border-radius: 2px;
        margin-top: 5px;
        overflow: hidden;
    }
    
    .strength-bar-fill {
        height: 100%;
        width: 0;
        transition: all 0.3s ease;
        border-radius: 2px;
    }
    
    .strength-weak { width: 33%; background: #dc3545; }
    .strength-medium { width: 66%; background: #ffc107; }
    .strength-strong { width: 100%; background: #28a745; }
    
    .form-hint.available { color: #28a745; }
    .form-hint.error { color: #dc3545; }
</style>
{% endblock %}

{% block content %}
<!-- 顶部导航 -->
<header class="admin-header">
    <div class="admin-header-left">
        <div class="admin-breadcrumb">
            <a href="/admin/">首页</a>
            <span>/</span>
            <span>修改密码</span>
        </div>
    </div>
</header>

<!-- 主要内容 -->
<div class="admin-content">
    <div class="password-form-container">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">修改密码</h3>
            </div>
            <div class="card-body">
                <!-- 密码提示 -->
                <div class="password-tips">
                    <h4>密码安全提示</h4>
                    <ul>
                        <li>密码长度至少8个字符</li>
                        <li>建议包含字母、数字和特殊字符</li>
                        <li>不要使用与其他网站相同的密码</li>
                        <li>定期更换密码以提高安全性</li>
                    </ul>
                </div>
                
                <!-- 密码修改表单 -->
                <form method="POST" class="password-form" id="passwordForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <!-- 当前密码 -->
                    <div class="form-group">
                        <label class="form-label" for="current_password">
                            当前密码 <span class="required">*</span>
                        </label>
                        <input type="password" 
                               class="form-input" 
                               id="current_password" 
                               name="current_password" 
                               placeholder="请输入当前密码"
                               required>
                    </div>
                    
                    <!-- 新密码 -->
<div class="form-group">
                        <label class="form-label" for="new_password">
                            新密码 <span class="required">*</span>
                        </label>
                        <input type="password" 
                               class="form-input" 
                               id="new_password" 
                               name="new_password" 
                               placeholder="请输入新密码"
                               required
                               minlength="8">
                        <div class="password-strength">
                            <span id="strengthText"></span>
                            <div class="strength-bar">
                                <div class="strength-bar-fill" id="strengthBar"></div>
                            </div>
                        </div>
                        <p class="form-hint">密码长度至少8个字符，建议包含字母和数字</p>
                    </div>
                    
                    <!-- 确认新密码 -->
                    <div class="form-group">
                        <label class="form-label" for="confirm_password">
                            确认新密码 <span class="required">*</span>
                        </label>
                        <input type="password" 
                               class="form-input" 
                               id="confirm_password" 
                               name="confirm_password" 
                               placeholder="请再次输入新密码"
                               required>
                        <p class="form-hint" id="confirmHint"></p>
                    </div>
                    
                    <!-- 提交按钮 -->
                    <div class="form-group">
                        <button type="submit" class="btn" id="submitBtn" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            修改密码
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // 密码强度检测
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');
    const confirmHint = document.getElementById('confirmHint');
    const submitBtn = document.getElementById('submitBtn');
    
    function checkPasswordStrength(password) {
        let strength = 0;
        let feedback = '';
        
        if (password.length >= 8) strength++;
        if (password.length >= 12) strength++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^a-zA-Z0-9]/.test(password)) strength++;
        
        if (password.length === 0) {
            feedback = '';
            strengthBar.className = 'strength-bar-fill';
            strengthBar.style.width = '0';
        } else if (strength <= 2) {
            feedback = '密码强度：弱';
            strengthBar.className = 'strength-bar-fill strength-weak';
            strengthBar.style.width = '33%';
        } else if (strength <= 3) {
            feedback = '密码强度：中等';
            strengthBar.className = 'strength-bar-fill strength-medium';
            strengthBar.style.width = '66%';
        } else {
            feedback = '密码强度：强';
            strengthBar.className = 'strength-bar-fill strength-strong';
            strengthBar.style.width = '100%';
        }
        
        strengthText.textContent = feedback;
        return strength >= 3;
    }
    
    function checkPasswordMatch() {
        const newPwd = newPassword.value;
        const confirmPwd = confirmPassword.value;
        
        if (!confirmPwd) {
            confirmHint.textContent = '';
            confirmHint.className = 'form-hint';
            return false;
        }
        
        if (newPwd === confirmPwd) {
            confirmHint.textContent = '✓ 密码匹配';
            confirmHint.className = 'form-hint available';
            return true;
        } else {
            confirmHint.textContent = '✗ 两次输入的密码不一致';
            confirmHint.className = 'form-hint error';
            return false;
        }
    }
    
    function validateForm() {
        const hasCurrentPassword = document.getElementById('current_password').value.length > 0;
        const isStrongEnough = checkPasswordStrength(newPassword.value);
        const isMatched = checkPasswordMatch();
        
        submitBtn.disabled = !(hasCurrentPassword && isStrongEnough && isMatched);
    }
    
    newPassword.addEventListener('input', function() {
        checkPasswordStrength(this.value);
        checkPasswordMatch();
        validateForm();
    });
    
    confirmPassword.addEventListener('input', function() {
        checkPasswordMatch();
        validateForm();
    });
    
    document.getElementById('current_password').addEventListener('input', validateForm);
</script>
{% endblock %}
