<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 资讯分享</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ============ CSS变量============ */
        :root {
            --primary-green: #5a7d5a;
            --primary-green-light: #7a9d7a;
            --primary-green-dark: #3d5a3d;
            --bg-light: #f8f9f7;
            --bg-cream: #f5f5f0;
            --text-dark: #2c3e2c;
            --text-gray: #5a6b5a;
            --text-light: #8a9a8a;
            --white: #ffffff;
            --shadow: rgba(90, 125, 90, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.9;
            color: var(--text-dark);
            background-color: var(--bg-light);
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 登录容器 */
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        /* 登录卡片 */
        .login-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
            padding: 40px;
            text-align: center;
            color: var(--white);
        }

        .login-logo {
            margin-bottom: 20px;
        }

        .login-logo img {
            height: 70px;
        }

        .login-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--bg-cream);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-dark);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(90, 125, 90, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-light);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-green), var(--primary-green-dark));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(90, 125, 90, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* 底部链接 */
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--bg-cream);
        }

        .login-footer a {
            color: var(--primary-green);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--primary-green-dark);
            text-decoration: underline;
        }

        /* 提示消息 */
        .messages {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            max-width: 400px;
        }

        .message {
            padding: 15px 25px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 20px var(--shadow);
            animation: slideDown 0.3s ease;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
opacity: 1;
            }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .login-container {
                padding: 20px;
            }

            .login-header,
            .login-body {
                padding: 30px;
            }

            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 提示消息 -->
    <div class="messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <img src="/images/四叶草堂LOGO.png" alt="四叶草堂">
                </div>
                <h1 class="login-title">管理员登录</h1>
                <p class="login-subtitle">资讯分享管理后台</p>
            </div>
            
            <div class="login-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label class="form-label" for="username">用户名</label>
                        <input type="text" 
                               class="form-input" 
                               id="username" 
                               name="username" 
                               placeholder="请输入用户名"
                               required
                               autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">密码</label>
                        <input type="password" 
                               class="form-input" 
                               id="password" 
                               name="password" 
                               placeholder="请输入密码"
                               required
                               autocomplete="current-password">
                    </div>
                    
                    <button type="submit" class="login-btn">登录</button>
                </form>
                
                <div class="login-footer">
                    <a href="/news">返回前台</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 自动隐藏提示消息
        setTimeout(function() {
            const messages = document.querySelectorAll('.message');
            messages.forEach(function(msg) {
                msg.style.opacity = '0';
                msg.style.transform = 'translateY(-20px)';
                setTimeout(function() {
                    msg.remove();
                }, 300);
            });
        }, 5000);
    </script>
</body>
</html>
