# Nginx配置文件示例
# /etc/nginx/sites-available/blog-system

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name communitygarden.org.cn;
    
    # 重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS主服务器配置
server {
    listen 443 ssl http2;
    server_name communitygarden.org.cn;
    
    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/communitygarden.org.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/communitygarden.org.cn.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 静态资源目录（现有网站）
    root /var/www/syctwebsite;
    index index.html;
    
    # 现有网站的路由
    location / {
        try_files $uri $uri/ =404;
    }
    
    # 资讯分享API代理
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 后台管理页面
    location /admin/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 工时统计页面
    location /workhour/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 博客静态资源
    location /blog_static/ {
        alias /var/www/blog_system/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 日志配置
    access_log /var/log/nginx/blog_access.log;
    error_log /var/log/nginx/blog_error.log;
}

# 图片子域名配置
server {
    listen 443 ssl http2;
    server_name images.communitygarden.org.cn;
    
    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/communitygarden.org.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/communitygarden.org.cn.key;
    
    # 重定向到COS
    location / {
        # 将请求重定向到COS桶的访问地址
        # 请将以下域名替换为您的COS桶的实际访问域名
        return 301 https://blog-images-1234567890.cos.ap-shanghai.myqcloud.com$request_uri;
    }
}
