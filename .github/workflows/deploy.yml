name: Deploy to CVM

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-cvm
  cancel-in-progress: true

env:
  APP_DIR: /opt/cloverweb

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 前端：CI 构建（CVM 不做 npm build，2C2G 防 OOM）----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          # dist 自检：必须含 index.html 与 UEditorPlus/（public 目录随构建拷贝）
          test -f dist/index.html
          test -d dist/UEditorPlus

      # ---- 打包：backend 源码 + 前端产物（不含 venv / .env / 本地库）----
      - name: Pack deploy bundle
        run: |
          mkdir -p bundle
          rsync -a backend/ bundle/backend/ \
            --exclude venv/ --exclude __pycache__/ \
            --exclude db.sqlite3 --exclude '.env*' \
            --exclude staticfiles/ --exclude media/
          cp -r web/dist bundle/web
          tar -czf deploy-bundle.tar.gz -C bundle .

      # ---- 传输 + 远程部署 ----
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload & deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          scp -P $SSH_PORT deploy-bundle.tar.gz $SSH_USER@$SSH_HOST:/tmp/cloverweb-deploy.tar.gz
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "sudo bash $APP_DIR/deploy/deploy.sh /tmp/cloverweb-deploy.tar.gz"

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          sleep 5
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "\
            systemctl is-active cloverweb && \
            curl -fsS -H 'Host: communitygarden.org.cn' -o /dev/null -w 'API HTTP %{http_code}\n' 'http://127.0.0.1:8000/api/ueditor/?action=config'"
